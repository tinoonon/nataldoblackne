<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Dados | Cortina de LED</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B1020">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-layout="checkout" class="is-co">
<div data-progress="1"></div>
<main class="co">
  <section class="card co__card" aria-labelledby="h">
    <h1 id="h">Seus dados</h1>
    <p class="co__lead">Usaremos para enviar a confirmação e o rastreio do pedido.</p>
    <form id="form" novalidate>
      <div class="field"><label for="name">Nome completo</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" inputmode="email" autocomplete="email" required></div>
      <div class="field"><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14" required></div>
      <div class="field"><label for="phone">WhatsApp</label><input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="(00) 00000-0000" maxlength="15" required><p class="field__hint">Enviamos o código de rastreio por aqui.</p></div>
      <div class="co__actions"><button class="btn btn--buy btn--block" type="submit">Continuar</button><a class="co__back" href="/carrinho">← Voltar ao carrinho</a></div>
    </form>
  </section>
  <aside class="co__aside" aria-label="Resumo do pedido"><div id="summary"></div></aside>
</main>
<script type="module" src="/js/checkout-dados.js"></script>
</body>
</html>
