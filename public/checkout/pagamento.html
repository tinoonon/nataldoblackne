<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Pagamento | Árvore de Natal</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#C8102E">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-layout="checkout" class="is-co">
<div data-progress="3"></div>
<main class="co">
  <section class="card co__card" aria-labelledby="h">
    <h1 id="h">Pagamento</h1>
    <p class="co__lead">Confira seus dados e escolha como pagar.</p>
    <div id="review"></div>
    <div class="form-alert" id="alert" role="alert" hidden></div>

    <h2 class="sec-h">Forma de pagamento</h2>
    <div class="opts"><label class="opt"><input type="radio" name="method" value="pix" checked><span class="opt__main"><span class="opt__t">Pix <span class="pix-badge">Aprovação na hora</span></span><span class="opt__d">Você paga pelo app do seu banco, 24h por dia.</span></span></label></div>

    <div class="notice" id="charge-box"></div>
    <div class="co__actions"><button class="btn btn--buy btn--block" id="pay" type="button">GERAR PIX</button><a class="co__back" href="/checkout/entrega">← Voltar</a></div>
  </section>
  <aside class="co__aside" aria-label="Resumo do pedido"><div id="summary"></div></aside>
</main>
<script type="module" src="/js/checkout-pagamento.js"></script>
</body>
</html>
